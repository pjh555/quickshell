<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Panda hacker">
  <mask id="cut">
    <rect width="24" height="24" fill="#FFFFFF"/>
    <!-- brim shadow line -->
    <path d="M3.4 10.3c2.3 1 5.2 1.5 8.6 1.5s6.3-.5 8.6-1.5" fill="none" stroke="#000000" stroke-width="1.4"/>
    <!-- chip -->
    <rect x="10.7" y="4.7" width="2.6" height="2.4" rx="0.55" fill="#000000"/>
    <!-- eye patches -->
    <ellipse cx="9.2" cy="13.2" rx="2.35" ry="2.15" transform="rotate(12 9.2 13.2)" fill="#000000"/>
    <ellipse cx="14.8" cy="13.2" rx="2.35" ry="2.15" transform="rotate(-12 14.8 13.2)" fill="#000000"/>
    <!-- nose -->
    <path d="M11 16.2h2l-.4 1.2h-1.2z" fill="#000000"/>
  </mask>

  <g mask="url(#cut)" fill="#FFFFFF">
    <!-- crown -->
    <path d="M5.9 8.2C5.7 5.4 6.6 3.2 8.2 2.4c1.2-.6 6.4-.6 7.6 0 1.6.8 2.5 3 2.3 5.8z"/>
    <!-- brim -->
    <path d="M3 8.4c2.2-1.4 5.4-2 9-2s6.8.6 9 2c.7.4.5 1.3-.3 1.6-2.3.8-5.4 1.2-8.7 1.2s-6.4-.4-8.7-1.2c-.8-.3-1-1.2-.3-1.6z"/>
    <!-- head -->
    <circle cx="12" cy="11.9" r="6.5"/>
    <!-- hoodie -->
    <path d="M12 19.2c-4.9 0-8.7 2.2-9.9 6.8h19.8c-1.2-4.6-5-6.8-9.9-6.8z"/>
  </g>

  <!-- eye shine -->
  <g fill="#FFFFFF">
    <circle cx="10" cy="12.5" r="0.55"/>
    <circle cx="15.6" cy="12.5" r="0.55"/>
  </g>
</svg>
