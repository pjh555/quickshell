<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Panda hacker">
  <g transform="translate(12 12) scale(0.93) translate(-12 -12)">
    <!-- hoodie -->
    <path d="M12 17.1c-4.8 0-8.4 2.3-9.6 7.2h19.2c-1.2-4.9-4.8-7.2-9.6-7.2z"
          fill="#BBD4D9" stroke="#22343A" stroke-width="1.35" stroke-linejoin="round"/>
    <!-- ears -->
    <g fill="#2B3D43" stroke="#22343A" stroke-width="1.35">
      <circle cx="5.7" cy="5.5" r="2.8"/>
      <circle cx="18.3" cy="5.5" r="2.8"/>
    </g>
    <!-- face -->
    <circle cx="12" cy="11.6" r="7.3" fill="#FFFFFF" stroke="#22343A" stroke-width="1.5"/>
    <!-- hat crown -->
    <path d="M6.9 8.8C6.7 6.2 7.4 4.2 8.7 3.4c1.1-.7 5.5-.7 6.6 0 1.3.8 2 2.8 1.8 5.4z"
          fill="#C6DCE1" stroke="#22343A" stroke-width="1.45" stroke-linejoin="round"/>
    <!-- brim -->
    <path d="M3.6 8.6c1.8-1.4 4.6-1.9 8.4-1.9s6.6.5 8.4 1.9c.5.4.4 1.1-.2 1.3-2 .8-4.9 1.1-8.2 1.1s-6.2-.3-8.2-1.1c-.6-.2-.7-.9-.2-1.3z"
          fill="#AFCBD1" stroke="#22343A" stroke-width="1.45" stroke-linejoin="round"/>
    <!-- chip -->
    <rect x="10.5" y="5.2" width="3" height="2.6" rx="0.6" fill="#3AAE9F"/>
    <!-- eye patches -->
    <ellipse cx="9.1" cy="13" rx="2.5" ry="2.3" transform="rotate(10 9.1 13)" fill="#1E2F35"/>
    <ellipse cx="14.9" cy="13" rx="2.5" ry="2.3" transform="rotate(-10 14.9 13)" fill="#1E2F35"/>
    <!-- eye shine -->
    <circle cx="9.9" cy="12.5" r="0.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="15.7" cy="12.5" r="0.5" fill="#FFFFFF" opacity="0.9"/>
    <!-- nose -->
    <path d="M10.9 16.2h2.2l-.5 1.2h-1.2z" fill="#1E2F35"/>
  </g>
</svg>
